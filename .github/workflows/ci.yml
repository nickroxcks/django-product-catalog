name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # Run the suite against both backends: SQLite (the local default) and
    # PostgreSQL (the Docker setup), since query behaviour can differ between them.
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: catalog
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://catalog:catalog@localhost:5432/catalog' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
