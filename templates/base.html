<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Product Catalog{% endblock %}</title>
  <style>
    /* Deliberately minimal: the assignment states styling is not evaluated. */
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 1rem; line-height: 1.4; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  </style>
</head>
<body>
  <header><h1><a href="/">Product Catalog</a></h1></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
